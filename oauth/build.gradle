configurations {
  docs {
    visible = false
    canBeConsumed = false
    canBeResolved = true
  }
}

dependencies {
  docs 'com.thoughtworks.qdox:qdox:2.2.0'
}

sourceSets {
  docs {
    compileClasspath += configurations.docs
    runtimeClasspath += configurations.docs
  }
}

tasks.register('generateDocs', JavaExec) {
  group = 'documentation'
  description = 'Generates configuration documentation from OAuth2Properties'
  mainClass = 'org.apache.iceberg.rest.oauth2.docs.DocumentationGenerator'
  classpath = configurations.docs + sourceSets.docs.runtimeClasspath

  def inputFile = project.file('src/main/java/org/apache/iceberg/rest/oauth2/OAuth2Properties.java')
  def outputFile = project.layout.buildDirectory.file('docs/configuration/configuration.md').get().asFile

  def headerFile = sourceSets.docs.resources.singleFile
  def header = headerFile.text

  inputs.files inputFile, headerFile
  outputs.file outputFile

  args inputFile.absolutePath,
       'org.apache.iceberg.rest.oauth2.OAuth2Properties',
       header,
       outputFile.absolutePath

  doFirst {
    outputFile.parentFile.mkdirs()
  }
}

publish.dependsOn generateDocs
