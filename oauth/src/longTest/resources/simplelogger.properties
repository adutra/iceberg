org.slf4j.simpleLogger.defaultLogLevel=INFO

org.slf4j.simpleLogger.log.org.apache.iceberg=INFO
org.slf4j.simpleLogger.log.org.apache.iceberg.rest.oauth2=INFO

# OAuth2 agent logs
org.slf4j.simpleLogger.log.org.apache.iceberg.rest.oauth2.agent=INFO

# OAuth2 flow logs
org.slf4j.simpleLogger.log.org.apache.iceberg.rest.oauth2.flow=INFO

# User emulator logs
org.slf4j.simpleLogger.log.org.apache.iceberg.rest.oauth2.test.user=INFO

# HTTP client logs; set this to DEBUG to log requests and responses
org.slf4j.simpleLogger.log.org.apache.hc.client5.http.wire=INFO

# Keycloak container logs
org.slf4j.simpleLogger.log.org.apache.iceberg.rest.oauth2.test.container.KeycloakContainer=WARN

# Polaris container logs
org.slf4j.simpleLogger.log.org.apache.iceberg.rest.oauth2.test.container.PolarisContainer=WARN

# Creates duplicated container logs
org.slf4j.simpleLogger.log.tc=OFF
